<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Moderna</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.2) 0%, transparent 50%);
            pointer-events: none;
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 450px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.3rem;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .calculator {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 30px;
            padding: 2rem;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Display */
        .display {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 20px;
            padding: 2rem 1.5rem;
            margin-bottom: 1.5rem;
            text-align: right;
            min-height: 120px;
            box-shadow: 
                inset 0 2px 10px rgba(0, 0, 0, 0.3),
                0 5px 20px rgba(59, 130, 246, 0.1);
        }

        .previous-operand {
            color: #64748b;
            font-size: 1.1rem;
            min-height: 1.8rem;
            font-weight: 500;
        }

        .current-operand {
            color: #e2e8f0;
            font-size: 3rem;
            font-weight: 700;
            word-wrap: break-word;
            word-break: break-all;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Botones */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .btn {
            padding: 1.5rem;
            font-size: 1.3rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 700;
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* Tipos de botones */
        .btn-number {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #e2e8f0;
        }

        .btn-number:hover {
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(59, 130, 246, 0.4);
        }

        .btn-operator {
            background: linear-gradient(135deg, #1e40af 0%, #7c3aed 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: white;
            box-shadow: 0 5px 20px rgba(59, 130, 246, 0.3);
        }

        .btn-operator:hover {
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.5);
        }

        .btn-clear {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            border: 1px solid rgba(220, 38, 38, 0.3);
            color: white;
            box-shadow: 0 5px 20px rgba(220, 38, 38, 0.3);
        }

        .btn-clear:hover {
            box-shadow: 0 8px 30px rgba(220, 38, 38, 0.5);
        }

        .btn-delete {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: white;
            box-shadow: 0 5px 20px rgba(245, 158, 11, 0.3);
        }

        .btn-delete:hover {
            box-shadow: 0 8px 30px rgba(245, 158, 11, 0.5);
        }

        .btn-equals {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: white;
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-equals:hover {
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.5);
        }

        .span-2 {
            grid-column: span 2;
        }

        /* Historial */
        .history {
            border-top: 1px solid rgba(59, 130, 246, 0.2);
            padding-top: 1.5rem;
            margin-top: 0.5rem;
        }

        .history h3 {
            color: #e2e8f0;
            margin-bottom: 1rem;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 1rem;
            padding-right: 0.5rem;
        }

        .history-list::-webkit-scrollbar {
            width: 6px;
        }

        .history-list::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 10px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.5);
            border-radius: 10px;
        }

        .history-item {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #94a3b8;
            transition: all 0.2s;
            cursor: pointer;
        }

        .history-item:hover {
            background: rgba(30, 41, 59, 0.7);
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateX(5px);
        }

        .btn-clear-history {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            border: 1px solid rgba(220, 38, 38, 0.3);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .btn-clear-history:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(220, 38, 38, 0.4);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .calculator {
                padding: 1.5rem;
            }

            .display {
                padding: 1.5rem 1rem;
            }

            .current-operand {
                font-size: 2.5rem;
            }

            .btn {
                padding: 1.2rem;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔢 Calculadora Moderna</h1>
            <p>Por Sebastián Salazar</p>
        </div>

        <div class="calculator">
            <div class="display">
                <div class="previous-operand"></div>
                <div class="current-operand">0</div>
            </div>
            
            <div class="buttons">
                <button class="btn btn-clear span-2">AC</button>
                <button class="btn btn-delete">DEL</button>
                <button class="btn btn-operator">÷</button>
                
                <button class="btn btn-number">7</button>
                <button class="btn btn-number">8</button>
                <button class="btn btn-number">9</button>
                <button class="btn btn-operator">×</button>
                
                <button class="btn btn-number">4</button>
                <button class="btn btn-number">5</button>
                <button class="btn btn-number">6</button>
                <button class="btn btn-operator">-</button>
                
                <button class="btn btn-number">1</button>
                <button class="btn btn-number">2</button>
                <button class="btn btn-number">3</button>
                <button class="btn btn-operator">+</button>
                
                <button class="btn btn-number span-2">0</button>
                <button class="btn btn-number">.</button>
                <button class="btn btn-equals">=</button>
            </div>
            
            <div class="history">
                <h3>📊 Historial</h3>
                <div class="history-list"></div>
                <button class="btn-clear-history">Limpiar Historial</button>
            </div>
        </div>
    </div>

    <script>
        class Calculator {
            constructor(previousOperandElement, currentOperandElement) {
                this.previousOperandElement = previousOperandElement;
                this.currentOperandElement = currentOperandElement;
                this.history = JSON.parse(localStorage.getItem('calculatorHistory')) || [];
                this.clear();
                this.updateHistory();
            }

            clear() {
                this.currentOperand = '0';
                this.previousOperand = '';
                this.operation = undefined;
            }

            delete() {
                if (this.currentOperand === '0') return;
                this.currentOperand = this.currentOperand.toString().slice(0, -1);
                if (this.currentOperand === '') this.currentOperand = '0';
            }

            appendNumber(number) {
                if (number === '.' && this.currentOperand.includes('.')) return;
                if (this.currentOperand === '0' && number !== '.') {
                    this.currentOperand = number.toString();
                } else {
                    this.currentOperand = this.currentOperand.toString() + number.toString();
                }
            }

            chooseOperation(operation) {
                if (this.currentOperand === '') return;
                if (this.previousOperand !== '') {
                    this.compute();
                }
                this.operation = operation;
                this.previousOperand = this.currentOperand;
                this.currentOperand = '0';
            }

            compute() {
                let computation;
                const prev = parseFloat(this.previousOperand);
                const current = parseFloat(this.currentOperand);
                
                if (isNaN(prev) || isNaN(current)) return;
                
                switch (this.operation) {
                    case '+':
                        computation = prev + current;
                        break;
                    case '-':
                        computation = prev - current;
                        break;
                    case '×':
                        computation = prev * current;
                        break;
                    case '÷':
                        if (current === 0) {
                            alert('No se puede dividir entre cero');
                            return;
                        }
                        computation = prev / current;
                        break;
                    default:
                        return;
                }
                
                // Redondear a 8 decimales para evitar errores de precisión
                computation = Math.round(computation * 100000000) / 100000000;
                
                // Guardar en historial
                const historyEntry = `${prev} ${this.operation} ${current} = ${computation}`;
                this.history.unshift(historyEntry);
                if (this.history.length > 15) this.history.pop();
                localStorage.setItem('calculatorHistory', JSON.stringify(this.history));
                this.updateHistory();
                
                this.currentOperand = computation;
                this.operation = undefined;
                this.previousOperand = '';
            }

            getDisplayNumber(number) {
                const stringNumber = number.toString();
                const integerDigits = parseFloat(stringNumber.split('.')[0]);
                const decimalDigits = stringNumber.split('.')[1];
                
                let integerDisplay;
                if (isNaN(integerDigits)) {
                    integerDisplay = '';
                } else {
                    integerDisplay = integerDigits.toLocaleString('es', {
                        maximumFractionDigits: 0
                    });
                }
                
                if (decimalDigits != null) {
                    return `${integerDisplay}.${decimalDigits}`;
                } else {
                    return integerDisplay;
                }
            }

            updateDisplay() {
                this.currentOperandElement.textContent = this.getDisplayNumber(this.currentOperand);
                
                if (this.operation != null) {
                    this.previousOperandElement.textContent =
                        `${this.getDisplayNumber(this.previousOperand)} ${this.operation}`;
                } else {
                    this.previousOperandElement.textContent = '';
                }
            }

            updateHistory() {
                const historyList = document.querySelector('.history-list');
                historyList.innerHTML = '';
                
                this.history.forEach(item => {
                    const div = document.createElement('div');
                    div.classList.add('history-item');
                    div.textContent = item;
                    historyList.appendChild(div);
                });
            }

            clearHistory() {
                this.history = [];
                localStorage.removeItem('calculatorHistory');
                this.updateHistory();
            }
        }

        // Inicializar calculadora
        const previousOperandElement = document.querySelector('.previous-operand');
        const currentOperandElement = document.querySelector('.current-operand');
        const calculator = new Calculator(previousOperandElement, currentOperandElement);

        // Event listeners para botones numéricos
        document.querySelectorAll('.btn-number').forEach(button => {
            button.addEventListener('click', () => {
                calculator.appendNumber(button.textContent);
                calculator.updateDisplay();
            });
        });

        // Event listeners para botones de operación
        document.querySelectorAll('.btn-operator').forEach(button => {
            button.addEventListener('click', () => {
                calculator.chooseOperation(button.textContent);
                calculator.updateDisplay();
            });
        });

        // Event listener para botón igual
        document.querySelector('.btn-equals').addEventListener('click', () => {
            calculator.compute();
            calculator.updateDisplay();
        });

        // Event listener para botón clear
        document.querySelector('.btn-clear').addEventListener('click', () => {
            calculator.clear();
            calculator.updateDisplay();
        });

        // Event listener para botón delete
        document.querySelector('.btn-delete').addEventListener('click', () => {
            calculator.delete();
            calculator.updateDisplay();
        });

        // Event listener para limpiar historial
        document.querySelector('.btn-clear-history').addEventListener('click', () => {
            calculator.clearHistory();
        });

        // Soporte para teclado
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                calculator.appendNumber(e.key);
                calculator.updateDisplay();
            }
            if (e.key === '.') {
                calculator.appendNumber(e.key);
                calculator.updateDisplay();
            }
            if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                const operation = e.key === '*' ? '×' : e.key === '/' ? '÷' : e.key;
                calculator.chooseOperation(operation);
                calculator.updateDisplay();
            }
            if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                calculator.compute();
                calculator.updateDisplay();
            }
            if (e.key === 'Backspace') {
                calculator.delete();
                calculator.updateDisplay();
            }
            if (e.key === 'Escape') {
                calculator.clear();
                calculator.updateDisplay();
            }
        });
    </script>
</body>
</html>
