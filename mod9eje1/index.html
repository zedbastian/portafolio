<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Moderna - Dark Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1) translateY(0); opacity: 0.5; }
            50% { transform: scale(1.1) translateY(-20px); opacity: 0.8; }
        }

        .container {
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .card {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.2);
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #fff;
            margin-bottom: 0.5rem;
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #a0a0c0;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .input-section {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            position: relative;
        }

        #itemInput {
            flex: 1;
            padding: 1rem 1.25rem;
            background: rgba(30, 30, 50, 0.8);
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 14px;
            font-size: 1rem;
            color: #fff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #itemInput::placeholder {
            color: #6b6b8b;
        }

        #itemInput:focus {
            outline: none;
            border-color: #8b5cf6;
            background: rgba(30, 30, 50, 1);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
            transform: translateY(-2px);
        }

        .btn {
            padding: 1rem 1.75rem;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-add {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .btn-add:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.6);
        }

        .stats {
            text-align: center;
            padding: 1.25rem;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 14px;
            margin-bottom: 1.5rem;
            color: #a0a0c0;
            border: 1px solid rgba(139, 92, 246, 0.2);
            backdrop-filter: blur(10px);
        }

        .stats strong {
            color: #8b5cf6;
            font-size: 1.4rem;
            margin: 0 0.25rem;
            display: inline-block;
            animation: countPulse 0.3s ease;
        }

        @keyframes countPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .item-list {
            list-style: none;
            max-height: 450px;
            overflow-y: auto;
            margin-bottom: 1.5rem;
            padding-right: 0.5rem;
        }

        .item-list::-webkit-scrollbar {
            width: 8px;
        }

        .item-list::-webkit-scrollbar-track {
            background: rgba(30, 30, 50, 0.5);
            border-radius: 10px;
        }

        .item-list::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.5);
            border-radius: 10px;
        }

        .item-list::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.7);
        }

        .item-list:empty::after {
            content: '✨ Sin items. ¡Añade uno para empezar!';
            display: block;
            text-align: center;
            color: #6b6b8b;
            padding: 3rem 1rem;
            font-size: 1.1rem;
        }

        .list-item {
            background: rgba(30, 30, 50, 0.6);
            padding: 1.25rem;
            margin-bottom: 0.75rem;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(139, 92, 246, 0.1);
            position: relative;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .list-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            border-radius: 14px 0 0 14px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .list-item:hover {
            transform: translateX(8px) scale(1.02);
            background: rgba(30, 30, 50, 0.9);
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.2);
        }

        .list-item:hover::before {
            opacity: 1;
        }

        .item-text {
            flex: 1;
            color: #e0e0f0;
            font-size: 1.05rem;
        }

        .item-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn-icon {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }

        .btn-icon:active::after {
            width: 100px;
            height: 100px;
        }

        .btn-edit {
            background: rgba(251, 146, 60, 0.2);
            color: #fb923c;
            border: 1px solid rgba(251, 146, 60, 0.3);
        }

        .btn-edit:hover {
            background: rgba(251, 146, 60, 0.3);
            transform: rotate(15deg) scale(1.1);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: rotate(-15deg) scale(1.1);
        }

        .btn-save {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .btn-save:hover {
            background: rgba(34, 197, 94, 0.3);
            transform: scale(1.1);
        }

        .actions {
            text-align: center;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            width: 100%;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
        }

        /* Edit mode */
        .list-item.editing {
            background: rgba(139, 92, 246, 0.1);
            border-color: #8b5cf6;
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
        }

        .list-item.editing .item-text {
            display: none;
        }

        .list-item .edit-input {
            display: none;
            flex: 1;
        }

        .list-item.editing .edit-input {
            display: block;
            padding: 0.75rem;
            background: rgba(30, 30, 50, 0.8);
            border: 2px solid #8b5cf6;
            border-radius: 10px;
            font-size: 1rem;
            color: #fff;
            animation: inputFocus 0.3s ease;
        }

        @keyframes inputFocus {
            from {
                transform: scale(0.95);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .list-item .btn-save {
            display: none;
        }

        .list-item.editing .btn-save {
            display: flex;
        }

        .list-item.editing .btn-edit {
            display: none;
        }

        @keyframes deleteItem {
            to {
                opacity: 0;
                transform: translateX(-100%) scale(0.8);
            }
        }

        .list-item.deleting {
            animation: deleteItem 0.4s ease forwards;
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }
            
            .card {
                padding: 1.75rem;
            }
            
            .input-section {
                flex-direction: column;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📝 Gestor de Lista</h1>
            <p class="subtitle">Añade, edita y elimina items con estilo</p>
            
            <div class="input-section">
                <input 
                    type="text" 
                    id="itemInput" 
                    placeholder="Escribe un nuevo item..."
                    autocomplete="off"
                >
                <button id="addBtn" class="btn btn-add">Añadir</button>
            </div>

            <div class="stats">
                <span>Total de items: <strong id="itemCount">0</strong></span>
            </div>

            <ul id="itemList" class="item-list">
            </ul>

            <div class="actions">
                <button id="clearAllBtn" class="btn btn-danger">Limpiar Todo</button>
            </div>
        </div>
    </div>

    <script>
        const itemInput = document.getElementById('itemInput');
        const addBtn = document.getElementById('addBtn');
        const itemList = document.getElementById('itemList');
        const itemCount = document.getElementById('itemCount');
        const clearAllBtn = document.getElementById('clearAllBtn');

        let count = 0;

        function updateCount() {
            const newCount = itemList.children.length;
            if (newCount !== count) {
                itemCount.style.animation = 'none';
                setTimeout(() => {
                    itemCount.style.animation = 'countPulse 0.3s ease';
                }, 10);
            }
            count = newCount;
            itemCount.textContent = count;
        }

        function createListItem(text) {
            const li = document.createElement('li');
            li.className = 'list-item';
            
            li.innerHTML = `
                <span class="item-text">${escapeHtml(text)}</span>
                <input type="text" class="edit-input" value="${escapeHtml(text)}">
                <div class="item-buttons">
                    <button class="btn-icon btn-edit" title="Editar">✏️</button>
                    <button class="btn-icon btn-save" title="Guardar">✓</button>
                    <button class="btn-icon btn-delete" title="Eliminar">🗑️</button>
                </div>
            `;
            
            return li;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addItem() {
            const text = itemInput.value.trim();
            
            if (text === '') {
                itemInput.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    itemInput.style.animation = '';
                }, 500);
                return;
            }
            
            const listItem = createListItem(text);
            itemList.appendChild(listItem);
            
            itemInput.value = '';
            itemInput.focus();
            
            updateCount();
        }

        function deleteItem(listItem) {
            listItem.classList.add('deleting');
            setTimeout(() => {
                listItem.remove();
                updateCount();
            }, 400);
        }

        function enableEditMode(listItem) {
            listItem.classList.add('editing');
            const editInput = listItem.querySelector('.edit-input');
            editInput.focus();
            editInput.select();
        }

        function saveEdit(listItem) {
            const editInput = listItem.querySelector('.edit-input');
            const itemText = listItem.querySelector('.item-text');
            const newText = editInput.value.trim();
            
            if (newText === '') {
                editInput.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    editInput.style.animation = '';
                }, 500);
                return;
            }
            
            itemText.textContent = newText;
            listItem.classList.remove('editing');
        }

        function clearAll() {
            if (count === 0) {
                return;
            }
            
            const items = Array.from(itemList.children);
            items.forEach((item, index) => {
                setTimeout(() => {
                    item.classList.add('deleting');
                    setTimeout(() => {
                        item.remove();
                        if (index === items.length - 1) {
                            updateCount();
                        }
                    }, 400);
                }, index * 50);
            });
        }

        addBtn.addEventListener('click', addItem);

        itemInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addItem();
            }
        });

        itemList.addEventListener('click', (e) => {
            const listItem = e.target.closest('.list-item');
            
            if (!listItem) return;
            
            if (e.target.classList.contains('btn-delete')) {
                deleteItem(listItem);
            }
            
            if (e.target.classList.contains('btn-edit')) {
                enableEditMode(listItem);
            }
            
            if (e.target.classList.contains('btn-save')) {
                saveEdit(listItem);
            }
        });

        itemList.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.classList.contains('edit-input')) {
                const listItem = e.target.closest('.list-item');
                saveEdit(listItem);
            }
        });

        itemList.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && e.target.classList.contains('edit-input')) {
                const listItem = e.target.closest('.list-item');
                listItem.classList.remove('editing');
            }
        });

        clearAllBtn.addEventListener('click', clearAll);

        updateCount();
    </script>
</body>
</html>
