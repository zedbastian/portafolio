<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Modo Oscuro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            border-radius: 50%;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            border-radius: 50%;
        }

        .container {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 1;
        }

        .form-wrapper {
            background: rgba(30, 30, 46, 0.8);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5),
                        0 0 100px rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #fff;
            margin-bottom: 0.5rem;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.6rem;
            color: #e5e7eb;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"] {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(17, 24, 39, 0.6);
            border: 2px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px;
            font-size: 1rem;
            color: #fff;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #6b7280;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
            background: rgba(17, 24, 39, 0.8);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        input.valid {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.05);
        }

        input.invalid {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.05);
        }

        .error-message {
            display: none;
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .form-group.error .error-message {
            display: flex;
        }

        .success-icon {
            position: absolute;
            right: 1.2rem;
            top: 2.8rem;
            color: #10b981;
            font-size: 1.2rem;
            display: none;
            animation: scaleIn 0.3s ease;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        .form-group.valid .success-icon {
            display: block;
        }

        .password-strength {
            margin-top: 0.7rem;
        }

        .strength-bar {
            height: 4px;
            background: rgba(75, 85, 99, 0.3);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .strength-bar::before {
            content: '';
            display: block;
            height: 100%;
            width: 0%;
            transition: all 0.4s ease;
            border-radius: 3px;
        }

        .strength-bar.weak::before {
            width: 33%;
            background: linear-gradient(90deg, #ef4444, #f87171);
        }

        .strength-bar.medium::before {
            width: 66%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
        }

        .strength-bar.strong::before {
            width: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
        }

        .strength-text {
            font-size: 0.85rem;
            color: #9ca3af;
            font-weight: 500;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 1rem 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin: 0;
            accent-color: #6366f1;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: normal;
            color: #d1d5db;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 1.1rem;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
            margin-top: 1rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            margin-top: 1.8rem;
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .login-link a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .login-link a:hover {
            color: #818cf8;
        }

        @media (max-width: 640px) {
            .form-wrapper {
                padding: 2rem;
            }

            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <h1>Crear Cuenta</h1>
            <p class="subtitle">Únete a nuestra comunidad</p>
            
            <form id="registrationForm" novalidate>
                <div class="form-group">
                    <label for="username">Nombre de Usuario</label>
                    <input type="text" id="username" name="username" required minlength="3" placeholder="johndoe">
                    <span class="error-message"></span>
                    <span class="success-icon">✓</span>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com">
                    <span class="error-message"></span>
                    <span class="success-icon">✓</span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required minlength="8" placeholder="••••••••">
                    <span class="error-message"></span>
                    <span class="success-icon">✓</span>
                    <div class="password-strength">
                        <div class="strength-bar"></div>
                        <span class="strength-text"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="••••••••">
                    <span class="error-message"></span>
                    <span class="success-icon">✓</span>
                </div>

                <div class="form-group">
                    <label for="phone">Teléfono (opcional)</label>
                    <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="1234567890">
                    <span class="error-message"></span>
                    <span class="success-icon">✓</span>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">Acepto los términos y condiciones</label>
                    <span class="error-message"></span>
                </div>

                <button type="submit" class="submit-btn">Registrarse</button>
            </form>

            <p class="login-link">¿Ya tienes cuenta? <a href="#">Iniciar sesión</a></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const inputs = form.querySelectorAll('input');

        const errorMessages = {
            username: {
                valueMissing: 'El nombre de usuario es obligatorio',
                tooShort: 'El nombre debe tener al menos 3 caracteres'
            },
            email: {
                valueMissing: 'El correo electrónico es obligatorio',
                typeMismatch: 'Ingresa un correo electrónico válido'
            },
            password: {
                valueMissing: 'La contraseña es obligatoria',
                tooShort: 'La contraseña debe tener al menos 8 caracteres'
            },
            confirmPassword: {
                valueMissing: 'Confirma tu contraseña',
                mismatch: 'Las contraseñas no coinciden'
            },
            phone: {
                patternMismatch: 'Ingresa un número de 10 dígitos'
            },
            terms: {
                valueMissing: 'Debes aceptar los términos y condiciones'
            }
        };

        inputs.forEach(input => {
            input.addEventListener('blur', () => validateField(input));
            input.addEventListener('input', () => {
                if (input.classList.contains('invalid')) {
                    validateField(input);
                }
                if (input.id === 'password') {
                    checkPasswordStrength(input.value);
                }
            });
        });

        function validateField(input) {
            const formGroup = input.closest('.form-group');
            const errorElement = formGroup.querySelector('.error-message');
            
            if (input.id === 'confirmPassword') {
                const password = document.getElementById('password').value;
                if (input.value !== password) {
                    showError(formGroup, errorElement, errorMessages.confirmPassword.mismatch);
                    return false;
                }
            }
            
            if (!input.checkValidity()) {
                const errorType = getErrorType(input.validity);
                const message = errorMessages[input.name]?.[errorType] || 'Campo inválido';
                showError(formGroup, errorElement, message);
                return false;
            }
            
            showSuccess(formGroup, errorElement);
            return true;
        }

        function getErrorType(validity) {
            if (validity.valueMissing) return 'valueMissing';
            if (validity.typeMismatch) return 'typeMismatch';
            if (validity.tooShort) return 'tooShort';
            if (validity.patternMismatch) return 'patternMismatch';
            return 'invalid';
        }

        function showError(formGroup, errorElement, message) {
            formGroup.classList.add('error');
            formGroup.classList.remove('valid');
            formGroup.querySelector('input').classList.add('invalid');
            formGroup.querySelector('input').classList.remove('valid');
            errorElement.textContent = '⚠ ' + message;
        }

        function showSuccess(formGroup, errorElement) {
            formGroup.classList.remove('error');
            formGroup.classList.add('valid');
            formGroup.querySelector('input').classList.remove('invalid');
            formGroup.querySelector('input').classList.add('valid');
            errorElement.textContent = '';
        }

        function checkPasswordStrength(password) {
            const strengthBar = document.querySelector('.strength-bar');
            const strengthText = document.querySelector('.strength-text');
            
            let strength = 0;
            
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/)) strength++;
            if (password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;
            
            strengthBar.className = 'strength-bar';
            
            if (strength <= 2) {
                strengthBar.classList.add('weak');
                strengthText.textContent = 'Débil';
                strengthText.style.color = '#f87171';
            } else if (strength <= 4) {
                strengthBar.classList.add('medium');
                strengthText.textContent = 'Media';
                strengthText.style.color = '#fbbf24';
            } else {
                strengthBar.classList.add('strong');
                strengthText.textContent = 'Fuerte';
                strengthText.style.color = '#34d399';
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            let isValid = true;
            
            inputs.forEach(input => {
                if (!validateField(input)) {
                    isValid = false;
                }
            });
            
            if (isValid) {
                const formData = new FormData(form);
                const data = Object.fromEntries(formData);
                
                console.log('Formulario válido:', data);
                alert('¡Registro exitoso! Revisa la consola para ver los datos.');
            } else {
                alert('Por favor, corrige los errores del formulario');
            }
        });
    </script>
</body>
</html>
