<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List - Dark Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a1f 0%, #1a1a3e 50%, #0f2027 100%);
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 20s ease-in-out infinite;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
            top: -200px;
            right: -200px;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #ec4899 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-50px, 50px) scale(0.9); }
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeInDown 0.8s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 50%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        header p {
            color: #9ca3af;
            font-size: 1.1rem;
            font-weight: 300;
        }

        .todo-app {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.1);
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-section {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            position: relative;
        }

        #todoInput {
            flex: 1;
            padding: 1.25rem 1.5rem;
            background: rgba(31, 41, 55, 0.8);
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 16px;
            font-size: 1.05rem;
            color: #f3f4f6;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #todoInput::placeholder {
            color: #6b7280;
        }

        #todoInput:focus {
            outline: none;
            border-color: #8b5cf6;
            background: rgba(31, 41, 55, 1);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15),
                        0 8px 20px rgba(139, 92, 246, 0.2);
            transform: translateY(-2px);
        }

        #addBtn {
            padding: 1.25rem 2.5rem;
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
            position: relative;
            overflow: hidden;
        }

        #addBtn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        #addBtn:active::before {
            width: 300px;
            height: 300px;
        }

        #addBtn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.6);
        }

        .filters {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
            background: rgba(31, 41, 55, 0.5);
            padding: 0.5rem;
            border-radius: 16px;
        }

        .filter-btn {
            flex: 1;
            padding: 1rem;
            background: transparent;
            color: #9ca3af;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .filter-btn:hover {
            color: #e5e7eb;
            background: rgba(55, 65, 81, 0.5);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            transform: translateY(-2px);
        }

        .count {
            display: inline-block;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-left: 0.5rem;
            font-weight: 700;
            min-width: 26px;
            text-align: center;
        }

        .filter-btn.active .count {
            background: rgba(255, 255, 255, 0.2);
        }

        .todo-list {
            list-style: none;
            margin-bottom: 2rem;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .todo-list::-webkit-scrollbar {
            width: 10px;
        }

        .todo-list::-webkit-scrollbar-track {
            background: rgba(31, 41, 55, 0.5);
            border-radius: 10px;
        }

        .todo-list::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.5);
            border-radius: 10px;
            border: 2px solid rgba(31, 41, 55, 0.5);
        }

        .todo-list::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.7);
        }

        .todo-list:empty::before {
            content: '✨ No hay tareas. ¡Crea una para empezar!';
            display: block;
            text-align: center;
            color: #6b7280;
            padding: 4rem 2rem;
            font-size: 1.1rem;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 1.25rem 1.5rem;
            background: rgba(31, 41, 55, 0.6);
            border-radius: 16px;
            margin-bottom: 0.75rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(139, 92, 246, 0.1);
            position: relative;
            overflow: hidden;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .todo-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #8b5cf6 0%, #ec4899 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .todo-item:hover {
            background: rgba(31, 41, 55, 0.9);
            transform: translateX(8px) scale(1.01);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.2);
        }

        .todo-item:hover::before {
            opacity: 1;
        }

        .todo-item.completed {
            opacity: 0.6;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #6b7280;
        }

        .todo-checkbox {
            width: 24px;
            height: 24px;
            margin-right: 1.25rem;
            cursor: pointer;
            appearance: none;
            border: 2px solid #6b7280;
            border-radius: 8px;
            transition: all 0.3s;
            position: relative;
            flex-shrink: 0;
        }

        .todo-checkbox:checked {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            border-color: #8b5cf6;
        }

        .todo-checkbox:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            color: white;
            font-size: 14px;
            font-weight: bold;
            animation: checkPop 0.3s ease;
        }

        @keyframes checkPop {
            0% { transform: translate(-50%, -50%) scale(0); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .todo-text {
            flex: 1;
            font-size: 1.05rem;
            color: #e5e7eb;
            line-height: 1.5;
        }

        .delete-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 10px rgba(239, 68, 68, 0.3);
            flex-shrink: 0;
        }

        .delete-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.5);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(139, 92, 246, 0.2);
            padding-top: 1.5rem;
            gap: 1rem;
        }

        #clearCompleted {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
            padding: 0.9rem 1.75rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        #clearCompleted:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
        }

        #itemsLeft {
            color: #9ca3af;
            font-size: 0.95rem;
            font-weight: 500;
        }

        #itemsLeft strong {
            color: #8b5cf6;
            font-weight: 700;
        }

        @keyframes deleteAnimation {
            to {
                opacity: 0;
                transform: translateX(100%) scale(0.8);
            }
        }

        .todo-item.deleting {
            animation: deleteAnimation 0.4s ease forwards;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            header h1 {
                font-size: 2rem;
            }

            .todo-app {
                padding: 1.5rem;
            }

            .input-section {
                flex-direction: column;
            }

            .filters {
                flex-direction: column;
                gap: 0.5rem;
            }

            .filter-btn {
                width: 100%;
            }

            .actions {
                flex-direction: column;
                align-items: stretch;
            }

            #clearCompleted {
                width: 100%;
            }

            #itemsLeft {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Mi Lista de Tareas</h1>
            <p>Organiza tu día de manera efectiva</p>
        </header>

        <div class="todo-app">
            <div class="input-section">
                <input type="text" id="todoInput" placeholder="¿Qué necesitas hacer?" />
                <button id="addBtn">Agregar</button>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">Todas <span class="count" id="allCount">0</span></button>
                <button class="filter-btn" data-filter="active">Activas <span class="count" id="activeCount">0</span></button>
                <button class="filter-btn" data-filter="completed">Completadas <span class="count" id="completedCount">0</span></button>
            </div>

            <ul id="todoList" class="todo-list"></ul>

            <div class="actions">
                <button id="clearCompleted">Limpiar Completadas</button>
                <span id="itemsLeft"><strong>0</strong> tareas pendientes</span>
            </div>
        </div>
    </div>

    <script>
        let todos = [];
        let currentFilter = 'all';

        const todoInput = document.getElementById('todoInput');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const clearCompletedBtn = document.getElementById('clearCompleted');

        function addTodo() {
            const text = todoInput.value.trim();
            if (text === '') {
                todoInput.style.animation = 'shake 0.5s';
                setTimeout(() => todoInput.style.animation = '', 500);
                return;
            }
            
            const todo = {
                id: Date.now(),
                text: text,
                completed: false
            };
            
            todos.push(todo);
            todoInput.value = '';
            todoInput.focus();
            renderTodos();
        }

        function deleteTodo(id) {
            const todoElement = document.querySelector(`[data-id="${id}"]`);
            if (todoElement) {
                todoElement.classList.add('deleting');
                setTimeout(() => {
                    todos = todos.filter(todo => todo.id !== id);
                    renderTodos();
                }, 400);
            }
        }

        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                renderTodos();
            }
        }

        function clearCompleted() {
            const completedItems = document.querySelectorAll('.todo-item.completed');
            if (completedItems.length === 0) return;

            completedItems.forEach((item, index) => {
                setTimeout(() => {
                    item.classList.add('deleting');
                }, index * 50);
            });

            setTimeout(() => {
                todos = todos.filter(todo => !todo.completed);
                renderTodos();
            }, completedItems.length * 50 + 400);
        }

        function renderTodos() {
            let filteredTodos = todos;
            if (currentFilter === 'active') {
                filteredTodos = todos.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                filteredTodos = todos.filter(t => t.completed);
            }
            
            todoList.innerHTML = '';
            
            filteredTodos.forEach(todo => {
                const li = document.createElement('li');
                li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                li.setAttribute('data-id', todo.id);
                
                const textContent = document.createElement('div');
                textContent.textContent = todo.text;
                const textNode = textContent.innerHTML;
                
                li.innerHTML = `
                    <input type="checkbox" class="todo-checkbox" ${todo.completed ? 'checked' : ''}>
                    <span class="todo-text">${textNode}</span>
                    <button class="delete-btn">Eliminar</button>
                `;
                
                const checkbox = li.querySelector('.todo-checkbox');
                checkbox.addEventListener('change', () => toggleTodo(todo.id));
                
                const deleteBtn = li.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', () => deleteTodo(todo.id));
                
                todoList.appendChild(li);
            });
            
            updateCounts();
        }

        function updateCounts() {
            const activeCount = todos.filter(t => !t.completed).length;
            const completedCount = todos.filter(t => t.completed).length;
            
            document.getElementById('allCount').textContent = todos.length;
            document.getElementById('activeCount').textContent = activeCount;
            document.getElementById('completedCount').textContent = completedCount;
            document.getElementById('itemsLeft').innerHTML = `<strong>${activeCount}</strong> tareas pendientes`;
        }

        addBtn.addEventListener('click', addTodo);
        
        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTodo();
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderTodos();
            });
        });

        clearCompletedBtn.addEventListener('click', clearCompleted);

        renderTodos();
    </script>
</body>
</html>
