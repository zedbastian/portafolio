<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Dark Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a1f 0%, #1a1a3e 50%, #0f2027 100%);
            min-height: 100vh;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            animation: float 30s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
            top: -300px;
            right: -300px;
        }

        body::after {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #ec4899 0%, transparent 70%);
            bottom: -250px;
            left: -250px;
            animation-delay: -15s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
            33% { transform: translate(80px, -80px) scale(1.2) rotate(120deg); }
            66% { transform: translate(-80px, 80px) scale(0.8) rotate(240deg); }
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(20px);
            padding: 1.75rem 2.5rem;
            border-radius: 24px;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.1);
            animation: fadeInDown 0.8s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .cart-icon {
            position: relative;
            font-size: 2.5rem;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .cart-icon:hover {
            transform: scale(1.1);
        }

        .cart-count {
            position: absolute;
            top: -10px;
            right: -10px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
            transition: transform 0.3s;
        }

        /* Main Content */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 450px;
            gap: 2rem;
            animation: fadeInUp 0.8s ease 0.2s backwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Products Section */
        .products-section {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(20px);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .products-section h2 {
            color: #f3f4f6;
            margin-bottom: 2rem;
            font-size: 1.75rem;
            font-weight: 700;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.75rem;
        }

        .product-card {
            background: rgba(31, 41, 55, 0.6);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(139, 92, 246, 0.1);
            animation: scaleIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0) 0%, rgba(139, 92, 246, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .product-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 20px 50px rgba(139, 92, 246, 0.3),
                        0 0 0 2px rgba(139, 92, 246, 0.4);
        }

        .product-card:hover::before {
            opacity: 1;
        }

        .product-image {
            width: 100%;
            height: 220px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3) 0%, rgba(236, 72, 153, 0.3) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            position: relative;
            overflow: hidden;
        }

        .product-image::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .product-info {
            padding: 1.75rem;
            position: relative;
            z-index: 1;
        }

        .product-name {
            color: #f3f4f6;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .product-description {
            color: #9ca3af;
            font-size: 0.95rem;
            margin-bottom: 1.25rem;
            line-height: 1.5;
        }

        .product-price {
            color: #8b5cf6;
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .product-stock {
            font-size: 0.9rem;
            color: #10b981;
            margin-bottom: 1.25rem;
            font-weight: 600;
        }

        .product-stock.low {
            color: #f59e0b;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .btn-add-cart {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn-add-cart::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-add-cart:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-add-cart:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.6);
        }

        .btn-add-cart:disabled {
            background: rgba(55, 65, 81, 0.5);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Cart Section */
        .cart-section {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(20px);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(139, 92, 246, 0.2);
            height: fit-content;
            position: sticky;
            top: 1.5rem;
        }

        .cart-section h2 {
            color: #f3f4f6;
            margin-bottom: 2rem;
            font-size: 1.75rem;
            font-weight: 700;
        }

        .cart-items {
            max-height: 450px;
            overflow-y: auto;
            margin-bottom: 2rem;
            padding-right: 0.5rem;
        }

        .cart-items::-webkit-scrollbar {
            width: 8px;
        }

        .cart-items::-webkit-scrollbar-track {
            background: rgba(31, 41, 55, 0.5);
            border-radius: 10px;
        }

        .cart-items::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.5);
            border-radius: 10px;
        }

        .cart-items::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.7);
        }

        .empty-cart {
            text-align: center;
            color: #6b7280;
            padding: 3rem 1rem;
            font-size: 1.1rem;
        }

        .cart-item {
            display: flex;
            gap: 1.25rem;
            padding: 1.25rem;
            background: rgba(31, 41, 55, 0.6);
            border-radius: 16px;
            margin-bottom: 1rem;
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(139, 92, 246, 0.1);
            transition: all 0.3s;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .cart-item:hover {
            background: rgba(31, 41, 55, 0.9);
            border-color: rgba(139, 92, 246, 0.3);
        }

        .cart-item-image {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3) 0%, rgba(236, 72, 153, 0.3) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            flex-shrink: 0;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 700;
            color: #f3f4f6;
            margin-bottom: 0.5rem;
            font-size: 1.05rem;
        }

        .cart-item-price {
            color: #8b5cf6;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 0.75rem;
        }

        .qty-btn {
            width: 34px;
            height: 34px;
            border: none;
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 10px rgba(139, 92, 246, 0.3);
        }

        .qty-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.5);
        }

        .qty-display {
            min-width: 35px;
            text-align: center;
            font-weight: 700;
            color: #f3f4f6;
            font-size: 1.05rem;
        }

        .btn-remove {
            margin-left: auto;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 10px rgba(239, 68, 68, 0.3);
        }

        .btn-remove:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
        }

        /* Cart Summary */
        .cart-summary {
            border-top: 2px solid rgba(139, 92, 246, 0.2);
            padding-top: 1.5rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            color: #9ca3af;
            font-size: 1rem;
        }

        .summary-row span:last-child {
            color: #f3f4f6;
            font-weight: 600;
        }

        .summary-row.total {
            font-size: 1.5rem;
            font-weight: 800;
            color: #f3f4f6;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 2px solid rgba(139, 92, 246, 0.3);
        }

        .summary-row.total span:last-child {
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn-checkout {
            width: 100%;
            padding: 1.25rem;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1.15rem;
            cursor: pointer;
            margin-bottom: 0.75rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-checkout:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.6);
        }

        .btn-clear {
            width: 100%;
            padding: 1rem;
            background: transparent;
            color: #ef4444;
            border: 2px solid #ef4444;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-clear:hover {
            background: #ef4444;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.active {
            display: flex;
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }

        .modal-content {
            position: relative;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(20px);
            padding: 3.5rem;
            border-radius: 24px;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            z-index: 1;
            border: 1px solid rgba(139, 92, 246, 0.3);
            animation: zoomIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-icon {
            font-size: 6rem;
            margin-bottom: 1.5rem;
            animation: bounceIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .modal-content h2 {
            color: #f3f4f6;
            margin-bottom: 1rem;
            font-size: 2rem;
            font-weight: 800;
        }

        .modal-content p {
            color: #9ca3af;
            margin-bottom: 0.75rem;
            font-size: 1.05rem;
        }

        .modal-content p strong {
            color: #f3f4f6;
        }

        .modal-content p strong span {
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.5rem;
        }

        .btn-primary {
            margin-top: 2rem;
            padding: 1.25rem 3rem;
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.6);
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .cart-section {
                position: static;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .header {
                padding: 1.25rem 1.5rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .products-section,
            .cart-section {
                padding: 1.75rem;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 1.25rem;
            }

            .modal-content {
                padding: 2.5rem;
                margin: 1rem;
            }
        }

        @media (max-width: 480px) {
            .products-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🛒 Mi Tienda Online</h1>
            <div class="cart-icon">
                <span class="icon">🛍️</span>
                <span class="cart-count" id="cartCount">0</span>
            </div>
        </header>

        <div class="main-content">
            <section class="products-section">
                <h2>Productos Disponibles</h2>
                <div class="products-grid" id="productsGrid"></div>
            </section>

            <aside class="cart-section">
                <h2>Carrito de Compras</h2>
                
                <div class="cart-items" id="cartItems">
                    <p class="empty-cart">Tu carrito está vacío</p>
                </div>

                <div class="cart-summary" id="cartSummary" style="display: none;">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>IVA (16%):</span>
                        <span id="tax">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Envío:</span>
                        <span id="shipping">$50.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="total">$0.00</span>
                    </div>
                    
                    <button class="btn-checkout" id="checkoutBtn">
                        Proceder al Pago
                    </button>
                    
                    <button class="btn-clear" id="clearCartBtn">
                        Vaciar Carrito
                    </button>
                </div>
            </aside>
        </div>
    </div>

    <div class="modal" id="confirmModal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="success-icon">✅</div>
            <h2>¡Pedido Realizado!</h2>
            <p>Tu pedido ha sido procesado exitosamente.</p>
            <p><strong>Total pagado: <span id="orderTotal"></span></strong></p>
            <button class="btn-primary" onclick="closeModal()">Cerrar</button>
        </div>
    </div>

    <script>
        const products = [
            {
                id: 1,
                name: 'Laptop Pro',
                price: 12999,
                description: 'Laptop de alto rendimiento',
                emoji: '💻',
                stock: 5
            },
            {
                id: 2,
                name: 'Smartphone',
                price: 8999,
                description: 'Teléfono inteligente de última generación',
                emoji: '📱',
                stock: 10
            },
            {
                id: 3,
                name: 'Auriculares',
                price: 2499,
                description: 'Auriculares inalámbricos con cancelación de ruido',
                emoji: '🎧',
                stock: 15
            },
            {
                id: 4,
                name: 'Tablet',
                price: 6999,
                description: 'Tablet de 10 pulgadas',
                emoji: '📱',
                stock: 8
            },
            {
                id: 5,
                name: 'Smartwatch',
                price: 4999,
                description: 'Reloj inteligente con GPS',
                emoji: '⌚',
                stock: 12
            },
            {
                id: 6,
                name: 'Cámara',
                price: 15999,
                description: 'Cámara profesional 4K',
                emoji: '📷',
                stock: 3
            }
        ];

        let cart = [];

        const productsGrid = document.getElementById('productsGrid');
        const cartItems = document.getElementById('cartItems');
        const cartCount = document.getElementById('cartCount');
        const cartSummary = document.getElementById('cartSummary');
        const subtotal = document.getElementById('subtotal');
        const tax = document.getElementById('tax');
        const shipping = document.getElementById('shipping');
        const total = document.getElementById('total');
        const checkoutBtn = document.getElementById('checkoutBtn');
        const clearCartBtn = document.getElementById('clearCartBtn');
        const confirmModal = document.getElementById('confirmModal');
        const orderTotal = document.getElementById('orderTotal');

        const SHIPPING_COST = 50;
        const TAX_RATE = 0.16;

        function renderProducts() {
            productsGrid.innerHTML = '';
            
            products.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                
                const stockClass = product.stock < 5 ? 'low' : '';
                const stockText = product.stock < 5 ? `¡Solo ${product.stock} disponibles!` : `${product.stock} disponibles`;
                
                const nameEl = document.createElement('div');
                nameEl.textContent = product.name;
                const name = nameEl.innerHTML;
                
                const descEl = document.createElement('div');
                descEl.textContent = product.description;
                const desc = descEl.innerHTML;
                
                productCard.innerHTML = `
                    <div class="product-image">${product.emoji}</div>
                    <div class="product-info">
                        <h3 class="product-name">${name}</h3>
                        <p class="product-description">${desc}</p>
                        <p class="product-price">$${product.price.toLocaleString()}</p>
                        <p class="product-stock ${stockClass}">${stockText}</p>
                        <button class="btn-add-cart" onclick="addToCart(${product.id})" ${product.stock === 0 ? 'disabled' : ''}>
                            ${product.stock === 0 ? 'Agotado' : 'Añadir al Carrito'}
                        </button>
                    </div>
                `;
                
                productsGrid.appendChild(productCard);
            });
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            
            if (!product || product.stock === 0) return;
            
            const existingItem = cart.find(item => item.id === productId);
            
            if (existingItem) {
                if (existingItem.quantity >= product.stock) {
                    return;
                }
                existingItem.quantity++;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    emoji: product.emoji,
                    quantity: 1
                });
            }
            
            renderCart();
            updateCartCount();
            
            cartCount.style.transform = 'scale(1.3)';
            setTimeout(() => {
                cartCount.style.transform = 'scale(1)';
            }, 300);
        }

        function renderCart() {
            if (cart.length === 0) {
                cartItems.innerHTML = '<p class="empty-cart">Tu carrito está vacío</p>';
                cartSummary.style.display = 'none';
                return;
            }
            
            cartItems.innerHTML = '';
            cartSummary.style.display = 'block';
            
            cart.forEach(item => {
                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                
                const nameEl = document.createElement('div');
                nameEl.textContent = item.name;
                const name = nameEl.innerHTML;
                
                cartItem.innerHTML = `
                    <div class="cart-item-image">${item.emoji}</div>
                    <div class="cart-item-info">
                        <div class="cart-item-name">${name}</div>
                        <div class="cart-item-price">${item.price.toLocaleString()}</div>
                        <div class="cart-item-controls">
                            <button class="qty-btn" onclick="decreaseQuantity(${item.id})">-</button>
                            <span class="qty-display">${item.quantity}</span>
                            <button class="qty-btn" onclick="increaseQuantity(${item.id})">+</button>
                            <button class="btn-remove" onclick="removeFromCart(${item.id})">Eliminar</button>
                        </div>
                    </div>
                `;
                
                cartItems.appendChild(cartItem);
            });
            
            updateTotals();
        }

        function increaseQuantity(productId) {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);
            
            if (cartItem.quantity >= product.stock) return;
            
            cartItem.quantity++;
            renderCart();
        }

        function decreaseQuantity(productId) {
            const cartItem = cart.find(item => item.id === productId);
            
            if (cartItem.quantity > 1) {
                cartItem.quantity--;
            } else {
                removeFromCart(productId);
                return;
            }
            
            renderCart();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            renderCart();
            updateCartCount();
        }

        function updateTotals() {
            const subtotalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const taxAmount = subtotalAmount * TAX_RATE;
            const shippingAmount = cart.length > 0 ? SHIPPING_COST : 0;
            const totalAmount = subtotalAmount + taxAmount + shippingAmount;
            
            subtotal.textContent = `${subtotalAmount.toLocaleString('es-MX', {minimumFractionDigits: 2})}`;
            tax.textContent = `${taxAmount.toLocaleString('es-MX', {minimumFractionDigits: 2})}`;
            shipping.textContent = `${shippingAmount.toLocaleString('es-MX', {minimumFractionDigits: 2})}`;
            total.textContent = `${totalAmount.toLocaleString('es-MX', {minimumFractionDigits: 2})}`;
        }

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.textContent = count;
        }

        function clearCart() {
            if (cart.length === 0) return;
            
            cart = [];
            renderCart();
            updateCartCount();
        }

        function checkout() {
            if (cart.length === 0) return;
            
            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const taxAmount = totalAmount * TAX_RATE;
            const finalTotal = totalAmount + taxAmount + SHIPPING_COST;
            
            orderTotal.textContent = `${finalTotal.toLocaleString('es-MX', {minimumFractionDigits: 2})}`;
            confirmModal.classList.add('active');
            
            setTimeout(() => {
                cart = [];
                renderCart();
                updateCartCount();
            }, 500);
        }

        function closeModal() {
            confirmModal.classList.remove('active');
        }

        checkoutBtn.addEventListener('click', checkout);
        clearCartBtn.addEventListener('click', clearCart);

        confirmModal.querySelector('.modal-overlay').addEventListener('click', closeModal);

        renderProducts();
        renderCart();
        updateCartCount();
    </script>
</body>
</html>
